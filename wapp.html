<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livecare Corretora — Peça sua cotação</title>

<meta property="og:title" content="Livecare Corretora — Peça sua cotação">
<meta property="og:description" content="Planos de saúde com CNPJ. Fale com um especialista agora.">
<meta property="og:image" content="https://raw.githubusercontent.com/livecarebr-prog/cotacao/main/WAPP%201.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f1f5f9; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
  .card { padding:24px; }
  img { max-width:280px; border-radius:12px; margin-bottom:16px; }
  #botaoContinuar { display:block; width:100%; max-width:280px; margin:0 auto; padding:16px 10px; border-radius:8px; text-decoration:none;
    font-size:16px; font-weight:700; text-align:center; color:#ffffff; background-color:#2563eb; border:none; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img id="banner" src="" alt="Livecare Corretora">
    <p>Planos de saúde com CNPJ podem custar até 40% menos.</p>
    <button id="botaoContinuar" onclick="continuar()">Ver oferta e pedir cotação</button>
  </div>

<script>
  // IMPORTANTE: o rastreio e o redirecionamento só acontecem quando
  // a pessoa CLICA no botão — nunca automaticamente ao carregar a
  // página. Isso evita que pré-visualizações (WhatsApp, Google
  // Sheets, gerenciadores de link) marquem abertura falsa só por
  // renderizar a página sem ninguém realmente ver/clicar.
  var params   = new URLSearchParams(window.location.search);
  var trackId  = params.get('id');
  var template = params.get('tpl') || '1';
  var destino  = 'https://tally.so/r/5BV58N';

  document.getElementById('banner').src = 'https://raw.githubusercontent.com/livecarebr-prog/cotacao/main/WAPP%20' + template + '.jpg';

  function continuar() {
    if (trackId) {
      var img = new Image();
      img.src = 'https://livecare-track.livecarebr.workers.dev/?action=view&id=WA-' + encodeURIComponent(trackId);
    }
    window.location.href = destino;
  }
</script>
</body>
</html>
