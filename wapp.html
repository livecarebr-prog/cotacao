<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livecare Corretora — Peça sua cotação</title>

<meta property="og:title" content="Livecare Corretora — Peça sua cotação">
<meta property="og:description" content="Planos de saúde com CNPJ. Fale com um especialista agora.">
<meta property="og:image" content="https://raw.githubusercontent.com/livecarebr-prog/cotacao/main/WAPP%201.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f1f5f9; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
  .card { padding:24px; }
  img { max-width:280px; border-radius:12px; margin-bottom:16px; }
  a { color:#2563eb; font-weight:bold; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <img id="banner" src="" alt="Livecare Corretora">
    <p>Redirecionando para o formulário de cotação...</p>
    <p><a id="linkManual" href="https://tally.so/r/5BV58N">Falar com um especialista agora</a></p>
  </div>

<script>
  var params   = new URLSearchParams(window.location.search);
  var trackId  = params.get('id');
  var template = params.get('tpl') || '1';
  var destino  = 'https://tally.so/r/5BV58N';

  document.getElementById('banner').src = 'https://raw.githubusercontent.com/livecarebr-prog/cotacao/main/WAPP%20' + template + '.jpg';

  if (trackId) {
    var img = new Image();
    img.src = 'https://livecare-track.livecarebr.workers.dev/?action=view&id=WPP-' + encodeURIComponent(trackId);
    document.getElementById('linkManual').href = destino;
    setTimeout(function() { window.location.replace(destino); }, 400);
  } else {
    window.location.replace(destino);
  }
</script>
</body>
</html>
